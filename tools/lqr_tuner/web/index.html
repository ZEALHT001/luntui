<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VMC LQR Tuner</title>
  </head>
  <body>
    <main id="app">
      <header class="toolbar">
        <div>
          <h1>VMC LQR Tuner</h1>
          <p>输入 Q/R 权重，计算 K 矩阵，并通过 RTT 下发。</p>
        </div>
        <div class="status" id="status">未连接</div>
      </header>

      <section class="panel grid">
        <label>
          API 地址
          <input id="apiBase" value="http://127.0.0.1:8765" />
        </label>
        <label>
          Preset
          <select id="preset">
            <option value="abk">abk</option>
            <option value="abk2">abk2</option>
          </select>
        </label>
        <label>
          当前腿长 L0 (m)
          <input id="legLength" type="number" step="0.001" value="0.28" />
        </label>
        <label>
          RTT TCP Host
          <input id="rttHost" value="127.0.0.1" />
        </label>
        <label>
          RTT TCP Port
          <input id="rttPort" type="number" step="1" value="19021" />
        </label>
      </section>

      <section class="panel">
        <h2>Q 权重</h2>
        <div class="weights" id="qWeights"></div>
      </section>

      <section class="panel">
        <h2>R 权重</h2>
        <div class="weights two" id="rWeights"></div>
      </section>

      <section class="panel">
        <h2>实时平衡参数</h2>
        <h3>姿态目标</h3>
        <div class="params">
          <label>
            Theta 目标 / theta_target (rad)
            <input id="thetaTarget" type="number" step="0.001" value="0.0" />
          </label>
          <label>
            Pitch 目标 / pitch_target (rad)
            <input id="pitchTarget" type="number" step="0.001" value="-0.05" />
          </label>
          <label>
            Theta 死区 / theta_deadband (rad)
            <input id="thetaDeadband" type="number" step="0.001" value="0.0" />
          </label>
          <label>
            Pitch 死区 / phi_deadband (rad)
            <input id="pitchDeadband" type="number" step="0.001" value="0.0" />
          </label>
        </div>

        <h3>LQR 关节力矩</h3>
        <div class="params">
          <label>
            关节 Tp 输出 / tp_output_enable
            <input id="tpOutputEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            用户轮子输出 / wheel_output_user_enable
            <input id="wheelOutputUserEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            dTheta 输出增益 / lqr_dtheta_gain
            <input id="lqrDthetaGain" type="number" step="0.1" value="1.0" />
          </label>
          <label>
            dTheta 死区 / lqr_dtheta_deadband (rad/s)
            <input id="lqrDthetaDeadband" type="number" step="0.01" value="0.0" />
          </label>
          <label>
            dTheta 限幅 / lqr_dtheta_limit (rad/s)
            <input id="lqrDthetaLimit" type="number" step="0.1" value="10" />
          </label>
          <label>
            轮子 T 力矩限幅 / wheel_torque_limit
            <input id="wheelTorqueLimit" type="number" step="0.1" min="0" value="3.3" />
          </label>
          <label>
            关节 Tp 力矩限幅 / tp_limit
            <input id="tpLimit" type="number" step="0.1" min="0" value="5.0" />
          </label>
          <label>
            关节 Phi 增益 / tp_phi_gain
            <input id="tpPhiGain" type="number" step="0.05" value="1.0" />
          </label>
          <label>
            关节 X/DX 增益 / tp_x_gain
            <input id="tpXGain" type="number" step="0.05" value="1.0" />
          </label>
          <label>
            dPitch 低通系数 / dpitch_lpf_alpha
            <input id="dpitchLpfAlpha" type="number" step="0.05" min="0.001" max="1" value="1.0" />
          </label>
        </div>

        <h3>扰动观测器（轮速误差积分 → Pitch 漂移补偿）</h3>
        <div class="params">
          <label>
            观测器使能 / disturbance_observer_enable
            <input id="disturbanceObserverEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            观测器增益 / disturbance_observer_gain
            <input id="disturbanceObserverGain" type="number" step="0.05" min="-20" max="20" value="0.3" />
          </label>
          <label>
            泄漏系数 / disturbance_observer_leak
            <input id="disturbanceObserverLeak" type="number" step="0.01" min="0" max="2" value="0.02" />
          </label>
          <label>
            补偿限幅（rad） / disturbance_observer_limit
            <input id="disturbanceObserverLimit" type="number" step="0.01" min="0" max="0.5" value="0.05" />
          </label>
          <label>
            参与观测的最大轮速（m/s） / disturbance_observer_speed_limit
            <input id="disturbanceObserverSpeedLimit" type="number" step="0.05" min="0.01" max="2" value="0.25" />
          </label>
          <label>
            摇杆回中后延时（s） / disturbance_observer_delay
            <input id="disturbanceObserverDelay" type="number" step="0.1" min="0" max="5" value="0.5" />
          </label>
          <label>
            分配到机身 Pitch / disturbance_observer_pitch_gain
            <input id="disturbanceObserverPitchGain" type="number" step="0.1" min="-2" max="2" value="0" />
          </label>
          <label>
            分配到虚拟腿 Theta / disturbance_observer_theta_gain
            <input id="disturbanceObserverThetaGain" type="number" step="0.1" min="-2" max="2" value="-1" />
          </label>
        </div>

        <h3>位置 / 速度反馈</h3>
        <div class="params">
          <label>
            X 增益 / x_feedback_gain
            <input id="xGain" type="number" step="0.1" value="-1" />
          </label>
          <label>
            dX 增益 / dx_feedback_gain
            <input id="dxGain" type="number" step="0.1" value="-1" />
          </label>
          <label>
            X 反馈限幅 / x_feedback_limit
            <input id="xLimit" type="number" step="0.1" value="20" />
          </label>
          <label>
            dX 反馈限幅 / dx_feedback_limit
            <input id="dxLimit" type="number" step="0.1" value="30" />
          </label>
        </div>

        <h3>速度控制</h3>
        <div class="params">
          <label>
            速控使能 / speed_control_enable
            <input id="speedControlEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            最大速度 / speed_target_max (m/s)
            <input id="speedTargetMax" type="number" step="0.1" value="2" />
          </label>
          <label>
            速度斜坡 / speed_ramp_rate
            <input id="speedRampRate" type="number" step="0.1" value="3" />
          </label>
          <label>
            速度死区 / speed_deadband
            <input id="speedDeadband" type="number" step="0.01" value="0.02" />
          </label>
          <label>
            停稳速度阈值 / stop_speed_threshold
            <input id="stopSpeedThreshold" type="number" step="0.01" value="0.08" />
          </label>
        </div>

        <h3>停车保持</h3>
        <div class="params">
          <label>
            锚点最大拉伸 / x_hold_max_stretch (m)
            <input id="xHoldMaxStretch" type="number" step="0.01" min="0" value="0.15" />
          </label>
        </div>

        <h3>减速度 Pitch 前馈（仅刹车时生效）</h3>
        <div class="params">
          <label>
            减速度 Pitch 增益 / speed_pitch_gain (rad/(m/s²))
            <input id="speedPitchGain" type="number" step="0.01" value="0.0" />
          </label>
          <label>
            Pitch 前馈限幅 / speed_pitch_limit
            <input id="speedPitchLimit" type="number" step="0.01" value="0.12" />
          </label>
          <label>
            Pitch 前馈斜坡 / speed_pitch_ramp_rate
            <input id="speedPitchRampRate" type="number" step="0.1" value="0.5" />
          </label>
        </div>

        <h3>腿长控制</h3>
        <div class="params">
          <label>
            腿长 KP / kp_length
            <input id="kpLength" type="number" step="1" value="2000" />
          </label>
          <label>
            腿长 KD / kd_length
            <input id="kdLength" type="number" step="1" value="100" />
          </label>
          <label>
            最大支撑力 / max_force
            <input id="maxForce" type="number" step="1" value="500" />
          </label>
          <label>
            静态支撑力 / support_force
            <input id="supportForce" type="number" step="1" value="0" />
          </label>
          <label>
            腿长斜坡 / length_ramp_rate
            <input id="lengthRampRate" type="number" step="0.01" value="0.2" />
          </label>
          <label>
            S1=1 最低腿长 / s1_up_leg_low (m)
            <input id="s1UpLegLow" type="number" step="0.005" min="0.12" max="0.385" value="0.18" />
          </label>
          <label>
            S1=1 最高腿长 / s1_up_leg_high (m)
            <input id="s1UpLegHigh" type="number" step="0.005" min="0.12" max="0.385" value="0.28" />
          </label>
          <label>
            S1=1 腿长变化速度 / s1_up_leg_speed (m/s)
            <input id="s1UpLegSpeed" type="number" step="0.01" min="0.001" max="1" value="0.05" />
          </label>
          <label>
            Roll 补偿使能 / roll_comp_enable
            <input id="rollCompEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            Roll 目标 / roll_target (rad)
            <input id="rollTarget" type="number" step="0.01" value="0.0" />
          </label>
          <label>
            Roll 腿长补偿增益 / roll_comp_gain
            <input id="rollCompGain" type="number" step="0.01" value="0.10" />
          </label>
          <label>
            Roll 腿长补偿限幅 / roll_comp_limit (m)
            <input id="rollCompLimit" type="number" step="0.005" min="0" value="0.04" />
          </label>
          <label>
            Roll 补偿斜坡 / roll_comp_ramp_rate
            <input id="rollCompRampRate" type="number" step="0.01" min="0" value="0.12" />
          </label>
        </div>

        <h3>摆角 PD</h3>
        <div class="params">
          <label>
            摆角 KP / kp_phi0
            <input id="kpPhi0" type="number" step="0.1" value="50" />
          </label>
          <label>
            摆角 KD / kd_phi0
            <input id="kdPhi0" type="number" step="0.01" value="0.5" />
          </label>
          <label>
            摆角力矩限幅 / max_phi0_torque
            <input id="maxPhi0Torque" type="number" step="1" value="80" />
          </label>
        </div>

        <h3>Yaw 闭环</h3>
        <div class="params">
          <label>
            Yaw 使能 / yaw_hold_enable
            <input id="yawHoldEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            Yaw KP / yaw_hold_kp
            <input id="yawHoldKp" type="number" step="1" value="2000" />
          </label>
          <label>
            Yaw KD / yaw_hold_kd
            <input id="yawHoldKd" type="number" step="1" value="0" />
          </label>
          <label>
            Yaw 死区 / yaw_hold_deadband
            <input id="yawHoldDeadband" type="number" step="0.001" value="0.01" />
          </label>
          <label>
            遥控 Yaw 目标速度 / yaw_target_rate_max (rad/s)
            <input id="yawTargetRateMax" type="number" step="0.1" value="2" />
          </label>
          <label>
            S1=1 Yaw 目标速度 / s1_up_yaw_target_rate_max (rad/s)
            <input id="s1UpYawTargetRateMax" type="number" step="0.1" min="0" max="10" value="4" />
          </label>
          <label>
            Yaw 电流限幅 / yaw_hold_current_limit
            <input id="yawHoldCurrentLimit" type="number" step="10" value="5000" />
          </label>
        </div>

        <h3>底盘跟随云台 Yaw PD</h3>
        <div class="params">
          <label>
            跟随使能 / gimbal_follow_enable
            <input id="gimbalFollowEnable" type="number" step="1" min="0" max="1" value="1" />
          </label>
          <label>
            跟随 KP / gimbal_follow_kp
            <input id="gimbalFollowKp" type="number" step="0.1" min="0" value="0.8" />
          </label>
          <label>
            跟随 KD / gimbal_follow_kd
            <input id="gimbalFollowKd" type="number" step="0.1" min="0" value="2.0" />
          </label>
          <label>
            编码器死区 / gimbal_follow_deadband
            <input id="gimbalFollowDeadband" type="number" step="1" min="0" max="4096" value="15" />
          </label>
          <label>
            跟随电流限幅 / gimbal_follow_current_limit
            <input id="gimbalFollowCurrentLimit" type="number" step="10" min="0" value="1500" />
          </label>
          <label>
            输出方向 / gimbal_follow_direction
            <select id="gimbalFollowDirection">
              <option value="1">+1</option>
              <option value="-1">-1</option>
            </select>
          </label>
          <label>
            正前方编码值 / gimbal_follow_front_ecd
            <input id="gimbalFollowFrontEcd" type="number" step="1" min="0" max="8191" value="6900" />
          </label>
          <label>
            正前方标定有效 / gimbal_follow_front_valid
            <input id="gimbalFollowFrontValid" type="number" step="1" min="0" max="1" value="1" />
          </label>
        </div>
        <div class="inline-actions">
          <button id="captureGimbalFrontBtn" type="button">以当前编码器标定正前方</button>
          <button id="sendGimbalFrontBtn" type="button">下发输入的正前方编码值</button>
          <span>捕获按钮只修改当前运行参数；输入值可随“写入固件默认值”保存到代码宏。</span>
        </div>
      </section>

      <section class="actions">
        <button id="calcBtn">计算 K</button>
        <button id="sendBtn">下发固定 K</button>
        <button id="clearKBtn">恢复固件 K 调度</button>
        <button id="sendParamsBtn">下发平衡参数</button>
        <button id="readFirmwareDefaultsBtn">读取固件参数</button>
        <button id="saveParamsBtn">保存全部参数</button>
        <button id="writeDefaultsBtn">写入固件默认值</button>
        <label class="check">
          <input id="dryRun" type="checkbox" checked />
          Dry run RTT
        </label>
        <label class="check">
          <input id="liveParams" type="checkbox" />
          实时下发参数
        </label>
      </section>

      <section class="panel">
        <h2>K 矩阵</h2>
        <table id="kTable"></table>
      </section>

      <section class="panel split">
        <div>
          <h2>RTT Payload</h2>
          <textarea id="payload" readonly></textarea>
        </div>
        <div>
          <h2>日志</h2>
          <pre id="log"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
